        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/landlord/payments:
    get:
      tags:
        - Payments
      operationId: landlordListPayments
      summary: List the landlord's payments with database filters
      description:
        Landlord only. All filters combine with AND and always retain the
        signed-in landlord's ownership scope. Empty values are ignored. Invalid
        IDs, statuses, unknown nonempty parameters or repeated parameters return
        400. Overdue means PENDING with a period due before today's date in the
        server timezone; unpaid means PENDING with a period due today or later.
        Results are ordered by payment date and ID descending. Archived history
        remains readable.
      parameters:
        - name: apartment
          in: query
          required: false
          description: Filter by the apartment ID.
          schema: &a2
            $ref: "#/components/schemas/RecordId"
        - name: lease
          in: query
          required: false
          description: Filter by the lease ID.
          schema: *a2
        - name: tenant
          in: query
          required: false
          description: Filter by the tenant ID.
          schema: *a2
        - name: period
          in: query
          required: false
          description: Filter by the period ID.
          schema: *a2
        - name: status
          in: query
          required: false
          description:
            Display status. Overdue payments are returned with their underlying
            unpaid status.
          schema:
            type: string
            enum:
              - unpaid
              - overdue
              - pending
              - confirmed
              - failed
      responses:
        "200":
          description: Matching payments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT-shaped
      description: |
        Send the access token returned by `POST /api/auth/login` or
        `POST /api/auth/refresh` as
        `Authorization: Bearer <access_token>`. The header takes precedence
        over the `auth` cookie when both are present. The token's encoding
        is described under `cookieAuth`.
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth
      description: |
        HttpOnly access-token cookie set by login and refresh; send it as
        `Cookie: auth=<access_token>`. The access token lasts 15 minutes.
        The token has a Base64-encoded `{"alg":"HS256","typ":"JWT"}`
        header, a Base64url-encoded `AuthTokenPayload`, and an unpadded
        Base64url HMAC-SHA256 signature. The fixed header's encoding is also
        valid Base64url. The signature covers the encoded header, a period,
        and the encoded payload, using server-side `AUTH_KEY`. The server
        also checks the current database user and role on every authenticated
        request. The same token may be sent in the Authorization Bearer header.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh
      description: |
        Opaque, single-use refresh token set in an HttpOnly `refresh` cookie
        by login and refresh. It expires after seven days, subject to renewal
        when refreshed within its last 24 hours. The server stores only its
        SHA-256 hash. Send it to `POST /api/auth/refresh`; it is not accepted
        as a Bearer token or as authentication for record endpoints.
  parameters:
    RecordId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[1-9][0-9]*$"
      description: Positive decimal integer within JavaScript's safe integer range.
  responses:
    BadRequest:
      description: Malformed JSON or invalid path ID.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    AuthValidationError:
      description:
        Well-formed JSON with invalid authentication input. Field errors
        are included.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AuthErrorResponse" }
    UnprocessableContent:
      description:
        Well-formed JSON with invalid fields or date relationships, or an
        unavailable tenant reference.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Bearer token or authentication cookie is missing or invalid.
      headers:
        WWW-Authenticate:
          description: Bearer authentication challenge.
          schema:
            type: string
            const: Bearer
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: The signed-in role does not match the API area.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description:
        Record, referenced tenant, or tenant profile does not exist or is
        outside the caller's scope.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: Record is archived or conflicts with existing dates or data.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ServerError:
      description: Unexpected record request failure.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
    AuthErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            fields:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
    SuccessResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }
    AccessTokenResponse:
      type: object
      required: [success, access_token, token_type, expires_in]
      properties:
        success: { type: boolean, const: true }
        access_token:
          {
            type: string,
            minLength: 1,
            description: Signed token to use in the Authorization Bearer header.,
          }
        token_type: { type: string, const: Bearer }
        expires_in:
          {
            type: integer,
            const: 900,
            description: Access token lifetime in seconds.,
          }
    AuthTokenPayload:
      type: object
      description:
        Claims stored in the signed access token, which is also sent in the
        `auth` cookie. This payload is not returned separately by any API
        response.
      additionalProperties: false
      required: [user, iat, exp]
      properties:
        user:
          type: object
          additionalProperties: false
          required: [id, email, role]
          properties:
            id: { type: integer, description: Database user ID. }
            email: { type: string, format: email }
            role: { type: string, enum: [LANDLORD, TENANT] }
        iat: { type: integer, description: Issued-at time as Unix seconds. }
        exp:
          {
            type: integer,
            description: Expiration time as Unix seconds; normally iat + 900.,
          }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, minLength: 1 }
        password: { type: string, minLength: 1 }
    RegisterInput:
      type: object
      required: [name, phoneNumber, email, password]
      properties:
        name: { type: string, minLength: 2 }
        phoneNumber: { type: string, minLength: 1 }
        email: { type: string, format: email, minLength: 1 }
        password: { type: string, minLength: 8 }
    RecordId:
      type: string
      pattern: "^[1-9][0-9]*$"
      description: Positive decimal integer within JavaScript's safe integer range.
    ApartmentInput:
      type: object
      additionalProperties: false
      required: [name, address]
      properties:
        name:
          {
            type: string,
            minLength: 1,
            description: Trimmed; whitespace-only values are rejected.,
          }
        address:
          {
            type: string,
            minLength: 1,
            description: Trimmed; whitespace-only values are rejected.,
          }
    Apartment:
      type: object
      required: [id, name, address, archivedAt]
      properties:
        id: { $ref: "#/components/schemas/RecordId" }
        name: { type: string }
        address: { type: string }
        archivedAt: { type: [string, "null"], format: date-time }
    LeaseInput:
      type: object
      additionalProperties: false
      required:
        - startDate
        - endDate
        - rentalPrice
        - tenantIds
      properties:
        apartmentId:
          {
            $ref: "#/components/schemas/RecordId",
            description: "Optional; if supplied, must match the parent ID in the URL.",
          }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        rentalPrice:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Total rent in cents.
        tenantIds:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/RecordId" }
    Lease:
      type: object
      required:
        [
          id,
          apartmentId,
          startDate,
          endDate,
          status,
          totalRentCents,
          tenantIds,
          archivedAt,
        ]
      properties:
        id: { $ref: "#/components/schemas/RecordId" }
        apartmentId: { $ref: "#/components/schemas/RecordId" }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status:
          {
            type: string,
            enum: [upcoming, active, ended],
            description: Computed from the lease dates.,
          }
        totalRentCents: { type: integer, description: Total rent in cents. }
        tenantIds:
          type: array
          items: { $ref: "#/components/schemas/RecordId" }
        archivedAt: { type: [string, "null"], format: date-time }
    PeriodInput:
      type: object
      additionalProperties: false
      required:
        - name
        - startDate
        - endDate
      properties:
        leaseId:
          {
            $ref: "#/components/schemas/RecordId",
            description: "Optional; if supplied, must match the parent ID in the URL.",
          }
        name:
          {
            type: string,
            minLength: 1,
            description: Trimmed; whitespace-only values are rejected.,
          }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
    PeriodNameInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          {
            type: string,
            minLength: 1,
            description: Trimmed; whitespace-only values are rejected.,
          }
    PaymentPeriod:
      type: object
      required: [id, leaseId, name, startDate, endDate, dueDate, archivedAt]
      properties:
        id: { $ref: "#/components/schemas/RecordId" }
        leaseId: { $ref: "#/components/schemas/RecordId" }
        name: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        archivedAt: { type: [string, "null"], format: date-time }
    ApartmentResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Apartment" }
    ApartmentListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Apartment" }
    LeaseResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Lease" }
    LeaseListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Lease" }
    PeriodResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/PaymentPeriod" }
    PeriodListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/PaymentPeriod" }
    TenantPayment:
      type: object
      required:
        - id
        - paymentPeriodId
        - leaseId
        - tenantId
        - amountCents
        - status
      properties:
        id: &a2
          $ref: "#/components/schemas/RecordId"
        paymentPeriodId: *a2
        leaseId: *a2
        tenantId: *a2
        amountCents:
          type: integer
        status:
          type: string
          enum:
            - unpaid
            - pending
            - confirmed
            - failed
    PaymentListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TenantPayment"
