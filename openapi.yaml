openapi: 3.1.0
info:
  title: Landlord Management API
  version: 0.1.0
  description: |
    HTTP API for apartments, leases, lease payment periods, and authentication.
    Record IDs are positive decimal strings. All record responses use a `data`
    envelope; record errors use an `error` envelope.

    Authentication accepts the 15-minute signed access token either as
    `Authorization: Bearer <token>` or in the HttpOnly `auth` cookie. Login
    sets that cookie and a seven-day HttpOnly `refresh` cookie, and returns
    the access token in JSON for API clients. `POST /api/auth/refresh` uses
    the refresh cookie to rotate the refresh token and issue a new access
    token. When an Authorization header is present on protected record
    requests, it takes precedence; an invalid header does not fall back to
    the `auth` cookie. See the security schemes and `AuthTokenPayload` below.
tags:
  - name: Authentication
  - name: Apartments
  - name: Leases
  - name: Payment periods
  - name: Tenants
  - name: Payments
security:
  - bearerAuth: []
  - cookieAuth: []
paths:
  /api/auth/register:
    post:
      tags:
        - Authentication
      operationId: register
      summary: Register an account
      description: The first registered account becomes a landlord; subsequent
        accounts become tenants. Registration does not sign the user in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email already registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/AuthValidationError"
  /api/auth/login:
    post:
      tags:
        - Authentication
      operationId: login
      summary: Sign in
      description:
        Sets HttpOnly `auth` and `refresh` cookies and returns the access
        token in JSON for Bearer clients. The refresh token is only sent in its
        cookie. Do not store the returned access token in browser local storage.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "201":
          description: Signed in.
          headers:
            Set-Cookie:
              description: |
                Two cookies are set: `auth=<access_token>; Max-Age=900;
                Path=/; HttpOnly; SameSite=Lax` and `refresh=<refresh_token>;
                Expires=<date>; Path=/; HttpOnly; SameSite=Lax`. `Secure` is
                also set in production. The refresh token expires after seven
                days.
              schema:
                type: string
            Cache-Control:
              description: Prevents caching of the token response.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid email or password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/AuthValidationError"
    delete:
      tags:
        - Authentication
      operationId: logout
      summary: Sign out
      description: Revokes the refresh session family when a `refresh` cookie is
        present, then clears the `auth` and `refresh` cookies. This operation
        also succeeds when no session exists. Already issued access tokens are
        not revoked and remain valid until expiration.
      security: []
      responses:
        "200":
          description: Signed out.
          headers:
            Set-Cookie:
              description: Clears the `auth` and `refresh` cookies (`Max-Age=0; Path=/`).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /api/auth/refresh:
    post:
      tags:
        - Authentication
      operationId: refreshAccessToken
      summary: Refresh an access token
      description: |
        Requires the HttpOnly `refresh` cookie; no request body or Bearer
        token is used. Consumes the current refresh token and rotates it,
        returning a new 15-minute access token. The replacement refresh
        token retains the session's expiry unless less than 24 hours remain,
        in which case its expiry is extended to seven days from refresh.
        Reusing a consumed refresh token revokes its session family.
      security:
        - refreshCookie: []
      responses:
        "201":
          description: Access token refreshed.
          headers:
            Set-Cookie:
              description: |
                Sets `auth=<access_token>; Max-Age=900; Path=/; HttpOnly;
                SameSite=Lax` and `refresh=<rotated_refresh_token>;
                Expires=<date>; Path=/; HttpOnly; SameSite=Lax`.
                `Secure` is also set in production.
              schema:
                type: string
            Cache-Control:
              description: Prevents caching of the token response.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "401":
          description:
            Refresh cookie is missing, invalid, or expired. An invalid supplied
            cookie also clears both authentication cookies.
          headers:
            Cache-Control:
              description: Prevents caching of the error response.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/landlord/apartments:
    get:
      tags:
        - Apartments
      operationId: landlordListApartments
      summary: List visible apartments
      description: Landlord only. Landlords see their apartments. Tenants see
        apartments linked through a lease assignment or payment history.
        Archived apartments remain in the list.
      responses:
        "200":
          description: Apartments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApartmentListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags:
        - Apartments
      operationId: landlordCreateApartment
      summary: Create an apartment
      description: Landlord only. The signed-in landlord becomes the owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApartmentInput"
      responses:
        "201":
          description: Apartment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApartmentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/landlord/apartments/{apartment}:
    get:
      tags:
        - Apartments
      operationId: landlordGetApartmentNested
      summary: Read an apartment
      description:
        Landlord only. Uses the same visibility rules as the apartment
        list. Archived apartments remain readable.
      responses:
        "200":
          description: Apartment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApartmentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    put:
      tags:
        - Apartments
      operationId: landlordUpdateApartmentNested
      summary: Update an apartment
      description: Landlord only. Archived apartments cannot be updated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApartmentInput"
      responses:
        "201":
          description: Updated apartment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApartmentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags:
        - Apartments
      operationId: landlordArchiveApartmentNested
      summary: Archive an apartment
      description:
        Landlord only. Sets `archivedAt`; deleting an already archived
        apartment returns it without changing the timestamp.
      responses:
        "200":
          description: Archived apartment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApartmentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    parameters:
      - name: apartment
        in: path
        required: true
        description:
          Positive decimal record ID; nested records must belong to the URL
          parent.
        schema:
          $ref: "#/components/schemas/RecordId"
  /api/landlord/leases:
    get:
      tags:
        - Leases
      operationId: landlordListLeases
      summary: List visible leases
      description:
        Landlord only. Landlords see leases for their apartments. Tenants
        see leases assigned to them or linked through their payment history.
        Archived leases remain in the list.
      responses:
        "200":
          description: Leases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaseListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/landlord/periods:
    get:
      tags:
        - Payment periods
      operationId: landlordListPeriods
      summary: List visible lease payment periods
      description:
        Landlord only. Landlords see periods for their apartments' leases.
        Tenants see periods for their assigned leases or linked through their
        payment history. Archived periods remain in the list.
      responses:
        "200":
          description: Payment periods.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeriodListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/landlord/apartments/{apartment}/leases:
    get:
      tags:
        - Leases
      operationId: landlordListLeasesNested
      summary: List visible leases
      description:
        Landlord only. Landlords see leases for their apartments. Tenants
        see leases assigned to them or linked through their payment history.
        Archived leases remain in the list.
      responses:
        "200":
          description: Leases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaseListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags:
        - Leases
      operationId: landlordCreateLeaseNested
      summary: Create a lease
      description:
        Landlord only. Tenants must be registered and available. Lease
        dates cannot overlap another lease for the apartment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaseInput"
      responses:
        "201":
          description: Lease created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "500":
          $ref: "#/components/responses/ServerError"
    parameters:
      - name: apartment
        in: path
        required: true
        description:
          Positive decimal record ID; nested records must belong to the URL
          parent.
        schema:
          $ref: "#/components/schemas/RecordId"
  /api/landlord/apartments/{apartment}/leases/{lease}:
    get:
      tags:
        - Leases
      operationId: landlordGetLeaseNested
      summary: Read a lease
      description:
        Landlord only. Uses the same visibility rules as the lease list.
        Archived leases remain readable.
      responses:
        "200":
          description: Lease.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    put:
      tags:
        - Leases
      operationId: landlordUpdateLeaseNested
      summary: Update a lease
      description: Landlord only. The URL determines the apartment; a supplied
        apartmentId must match it. New dates must contain all existing periods
        and cannot overlap another lease. Existing assigned tenants may remain
        even if archived.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaseInput"
      responses:
        "201":
          description: Updated lease.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags:
        - Leases
      operationId: landlordArchiveLeaseNested
      summary: Archive a lease
      description:
        Landlord only. Sets `archivedAt`; deleting an already archived
        lease returns it without changing the timestamp.
      responses:
        "200":
          description: Archived lease.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    parameters:
      - name: apartment
        in: path
        required: true
        description:
          Positive decimal record ID; nested records must belong to the URL
          parent.
        schema:
          $ref: "#/components/schemas/RecordId"
      - name: lease
        in: path
        required: true
        description:
          Positive decimal record ID; nested records must belong to the URL
          parent.
        schema:
          $ref: "#/components/schemas/RecordId"
  /api/landlord/apartments/{apartment}/leases/{lease}/periods:
    get:
      tags:
        - Payment periods
      operationId: landlordListPeriodsNested
      summary: List visible lease payment periods
      description:
        Landlord only. Landlords see periods for their apartments' leases.
        Tenants see periods for their assigned leases or linked through their
        payment history. Archived periods remain in the list.
      responses:
        "200":
          description: Payment periods.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeriodListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags:
        - Payment periods
      operationId: landlordCreatePeriodNested
      summary: Create a lease payment period
      description:
        Landlord only. Dates must be within the active lease and cannot
        overlap another period. Creates one payment per assigned tenant,
        splitting rent as evenly as possible; `dueDate` equals `endDate`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeriodInput"
      responses:
        "201":
          description: Period and tenant payments created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeriodResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "500":
          $ref: "#/components/responses/ServerError"
    parameters:
      - name: apartment
        in: path
        required: true
        description:
          Positive decimal record ID; nested records must belong to the URL
          parent.
        schema:
          $ref: "#/components/schemas/RecordId"
      - name: lease
        in: path
        required: true
        description:
          Positive decimal record ID; nested records must belong to the URL
          parent.
        schema:
          $ref: "#/components/schemas/RecordId"
  /api/landlord/apartments/{apartment}/leases/{lease}/periods/{period}:
    get:
      tags:
        - Payment periods
      operationId: landlordGetPeriodNested
      summary: Read a lease payment period
      description:
        Landlord only. Uses the same visibility rules as the period list.
        Archived periods remain readable.
      responses:
        "200":
          description: Payment period.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeriodResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    put:
      tags:
        - Payment periods
      operationId: landlordUpdatePeriodNameNested
      summary: Rename a lease payment period
      description:
        Landlord only. Only `name` can be changed; dates, due date, and
        tenant payment amounts stay fixed. The period and its parent lease and
        apartment must be active.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeriodNameInput"
      responses:
        "201":
          description: Updated payment period.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeriodResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags:
        - Payment periods
      operationId: landlordArchivePeriodNested
      summary: Archive a lease payment period
      description:
        Landlord only. Sets `archivedAt`; deleting an already archived
        period returns it without changing the timestamp.
      responses:
        "200":
          description: Archived payment period.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeriodResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    parameters:
      - name: apartment
        in: path
        required: true
        description:
          Positive decimal record ID; nested records must belong to the URL
          parent.
        schema:
          $ref: "#/components/schemas/RecordId"
      - name: lease
        in: path
        required: true
        description:
          Positive decimal record ID; nested records must belong to the URL
          parent.
        schema:
          $ref: "#/components/schemas/RecordId"
      - name: period
        in: path
        required: true
        description:
          Positive decimal record ID; nested records must belong to the URL
          parent.
        schema:
          $ref: "#/components/schemas/RecordId"
  /api/tenant/apartments:
    get:
      tags:
        - Apartments
      operationId: tenantListApartments
      summary: List visible apartments
      description:
        Tenant only; limited to assigned leases or own payment history.
        Landlords see their apartments. Tenants see apartments linked through a
        lease assignment or payment history. Archived apartments remain in the
        list.
      responses:
        "200":
          description: Apartments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApartmentListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/tenant/apartments/{apartment}:
    get:
      tags:
        - Apartments
      operationId: tenantGetApartmentNested
      summary: Read an apartment
      description:
        Tenant only; limited to assigned leases or own payment history.
        Uses the same visibility rules as the apartment list. Archived
        apartments remain readable.
      responses:
        "200":
          description: Apartment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApartmentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    parameters:
      - name: apartment
        in: path
        required: true
        description:
          Positive decimal record ID; nested records must belong to the URL
          parent.
        schema:
          $ref: "#/components/schemas/RecordId"
  /api/tenant/leases:
    get:
      tags:
        - Leases
      operationId: tenantListLeases
      summary: List visible leases
      description:
        Tenant only; limited to assigned leases or own payment history.
        Landlords see leases for their apartments. Tenants see leases assigned
        to them or linked through their payment history. Archived leases remain
        in the list.
      responses:
        "200":
          description: Leases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaseListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/tenant/periods:
    get:
      tags:
        - Payment periods
      operationId: tenantListPeriods
      summary: List visible lease payment periods
      description:
        Tenant only; limited to assigned leases or own payment history.
        Landlords see periods for their apartments' leases. Tenants see periods
        for their assigned leases or linked through their payment history.
        Archived periods remain in the list.
      responses:
        "200":
          description: Payment periods.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeriodListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/tenant/apartments/{apartment}/leases:
    get:
      tags:
        - Leases
      operationId: tenantListLeasesNested
      summary: List visible leases
      description:
        Tenant only; limited to assigned leases or own payment history.
        Landlords see leases for their apartments. Tenants see leases assigned
        to them or linked through their payment history. Archived leases remain
        in the list.
      responses:
        "200":
          description: Leases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaseListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
