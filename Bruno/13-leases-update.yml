info:
  name: "Sutartys: PUT įrašą → 201"
  type: http
  seq: 13

http:
  method: PUT
  url: "{{baseUrl}}/api/landlord/apartments/{{apartmentId}}/leases/{{leaseId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "startDate": "2027-01-01",
        "endDate": "2027-12-31",
        "rentalPrice": 130000,
        "tenantIds": [
          "{{tenantId}}"
        ]
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("PUT /api/landlord/apartments/{{apartmentId}}/leases/{{leaseId}} → 201", function () {
          expect(res.status).to.equal(201);
        });

        test("Grąžintas tinkamas įrašas", function () {
          expect(res.body.data.id).to.equal(bru.getVar("leaseId"));
          expect(res.body.data.totalRentCents).to.equal(130000);
        });

        test("Sutartis priklauso URL nurodytam butui", function () {
          expect(res.body.data.apartmentId).to.equal(bru.getVar("apartmentId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
