info:
  name: Laukiantys mokėjimai → 200
  type: http
  seq: 39
http:
  method: GET
  url: "{{baseUrl}}/api/landlord/payments?status=pending"
  auth:
    type: bearer
    token: "{{accessToken}}"
runtime:
  scripts:
    - type: tests
      code: |-
        test("GET /api/landlord/payments?status=pending → 200", function () {
          expect(res.status).to.equal(200);
        });

        test("Grąžintas mokėjimų sąrašas", function () {
          expect(res.body.data).to.be.an("array");
        });

        test("Tik laukiančio patvirtinimo mokėjimai", function () {
          expect(res.body.data.every(payment => payment.status === "pending")).to.equal(true);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
