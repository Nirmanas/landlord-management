info:
  name: "Butai: GET įrašą → 200"
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/apartments/{{apartmentId}}"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("GET /api/apartments/{{apartmentId}} → 200", function () {
          expect(res.status).to.equal(200);
        });

        test("Grąžintas tinkamas įrašas", function () {
          expect(res.body.data.id).to.equal(bru.getVar("apartmentId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
