info:
  name: Nuomotojas negali naudoti nuomininko API → 403
  type: http
  seq: 24
http:
  method: GET
  url: "{{baseUrl}}/api/tenant/apartments"
  auth:
    type: bearer
    token: "{{accessToken}}"
runtime:
  scripts:
    - type: tests
      code: |-
        test("GET /api/tenant/apartments → 403", function () {
          expect(res.status).to.equal(403);
        });

        test("Grąžinta rolės klaida", function () {
          expect(res.body.error).to.equal("Only tenants can do that.");
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
