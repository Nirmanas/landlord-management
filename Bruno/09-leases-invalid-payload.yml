info:
  name: "Sutartys: blogi laukai → 422"
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/leases"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "apartmentId": "{{apartmentId}}",
        "startDate": "2027-01-01",
        "endDate": "2027-12-31",
        "rentalPrice": -1,
        "tenantIds": [
          "{{tenantId}}"
        ]
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("POST /api/leases → 422", function () {
          expect(res.status).to.equal(422);
        });

        test("Grąžinta klaida", function () {
          expect(res.body.error).to.be.a("string").and.not.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
