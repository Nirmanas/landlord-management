info:
  name: "Butai: POST → 201"
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/landlord/apartments"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Bruno demonstracinis butas",
        "address": "Testų g. 15, Vilnius"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: after-response
      code: if (res.status === 201 && res.body?.data?.id) bru.setVar("apartmentId",
        res.body.data.id);
    - type: tests
      code: |-
        test("POST /api/landlord/apartments → 201", function () {
          expect(res.status).to.equal(201);
        });

        test("Buto atsakymo laukai", function () {
          expect(res.body).to.have.property("data");
          expect(res.body.data).to.have.property("id");
          expect(res.body.data).to.have.property("name");
          expect(res.body.data).to.have.property("address");
          expect(res.body.data).to.have.property("archivedAt");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
