info:
  name: "Laikotarpiai: GET sąrašą → 200"
  type: http
  seq: 17

http:
  method: GET
  url: "{{baseUrl}}/api/landlord/apartments/{{apartmentId}}/leases/{{leaseId}}/pe\
    riods"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("GET /api/landlord/apartments/{{apartmentId}}/leases/{{leaseId}}/periods → 200", function () {
          expect(res.status).to.equal(200);
        });

        test("Sąraše yra sukurtas įrašas", function () {
          expect(res.body.data).to.be.an("array");
          expect(res.body.data.some(item => item.id === bru.getVar("periodId"))).to.equal(true);
        });

        test("Sąraše tik pasirinktos sutarties laikotarpiai", function () {
          expect(res.body.data.every(item => item.leaseId === bru.getVar("leaseId"))).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
