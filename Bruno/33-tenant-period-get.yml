info:
  name: Nuomininko laikotarpis → 200
  type: http
  seq: 33
http:
  method: GET
  url: "{{baseUrl}}/api/tenant/apartments/{{apartmentId}}/leases/{{leaseId}}/peri\
    ods/{{periodId}}"
  auth:
    type: bearer
    token: "{{tenantAccessToken}}"
runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getEnvVar("tenantEmail") || !bru.getEnvVar("tenantPassword") || !bru.getVar("tenantAccessToken")) {
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        test("GET /api/tenant/apartments/{{apartmentId}}/leases/{{leaseId}}/periods/{{periodId}} → 200", function () {
          expect(res.status).to.equal(200);
        });

        test("Įrašas ir jo tėvinis ryšys", function () {
          expect(res.body.data.id).to.equal(bru.getVar("periodId"));
          expect(res.body.data.leaseId).to.equal(bru.getVar("leaseId"));
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
