info:
  name: "Sutartys: GET įrašą → 200"
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/api/landlord/apartments/{{apartmentId}}/leases/{{leaseId}}"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("GET /api/landlord/apartments/{{apartmentId}}/leases/{{leaseId}} → 200", function () {
          expect(res.status).to.equal(200);
        });

        test("Grąžintas tinkamas įrašas", function () {
          expect(res.body.data.id).to.equal(bru.getVar("leaseId"));
        });

        test("Sutartis priklauso URL nurodytam butui", function () {
          expect(res.body.data.apartmentId).to.equal(bru.getVar("apartmentId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
