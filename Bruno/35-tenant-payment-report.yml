info:
  name: "Nuomininkas: pranešti apie mokėjimą → 200"
  type: http
  seq: 35
http:
  method: PATCH
  url: "{{baseUrl}}/api/tenant/payments/{{paymentId}}/report"
  auth:
    type: bearer
    token: "{{tenantAccessToken}}"
runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("reportedPaymentId", "");
        if (!bru.getEnvVar("paymentId") || !bru.getEnvVar("tenantEmail") || !bru.getEnvVar("tenantPassword") || !bru.getVar("tenantAccessToken")) {
          bru.runner.skipRequest();
        }
    - type: after-response
      code: |-
        if (res.status === 200 && res.body?.data?.status === "pending") bru.setVar("reportedPaymentId", res.body.data.id);
    - type: tests
      code: |-
        test("PATCH /api/tenant/payments/{{paymentId}}/report → 200", function () {
          expect(res.status).to.equal(200);
        });

        test("Savo mokėjimas perduotas peržiūrai", function () {
          expect(res.body.data.id).to.equal(bru.getEnvVar("paymentId"));
          expect(res.body.data.status).to.equal("pending");
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
