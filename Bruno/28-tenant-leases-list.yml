info:
  name: Nuomininko sutarčių suvestinė → 200
  type: http
  seq: 28
http:
  method: GET
  url: "{{baseUrl}}/api/tenant/leases"
  auth:
    type: bearer
    token: "{{tenantAccessToken}}"
runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getEnvVar("tenantEmail") || !bru.getEnvVar("tenantPassword") || !bru.getVar("tenantAccessToken")) {
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        test("GET /api/tenant/leases → 200", function () {
          expect(res.status).to.equal(200);
        });

        test("Grąžintas sąrašas", function () {
          expect(res.body.data).to.be.an("array");
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
