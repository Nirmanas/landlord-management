info:
  name: "Sutartys: POST → 201"
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/api/leases"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "apartmentId": "{{apartmentId}}",
        "startDate": "2027-01-01",
        "endDate": "2027-12-31",
        "rentalPrice": 120000,
        "tenantIds": [
          "{{tenantId}}"
        ]
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: after-response
      code: if (res.status === 201 && res.body?.data?.id) bru.setVar("leaseId", res.body.data.id);
    - type: tests
      code: |-
        test("POST /api/leases → 201", function () {
          expect(res.status).to.equal(201);
        });

        test("Sutarties atsakymo laukai", function () {
          expect(res.body).to.have.property("data");
          expect(res.body.data).to.have.property("id");
          expect(res.body.data).to.have.property("apartmentId");
          expect(res.body.data).to.have.property("startDate");
          expect(res.body.data).to.have.property("endDate");
          expect(res.body.data).to.have.property("tenantIds");
          expect(res.body.data).to.have.property("archivedAt");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
