info:
  name: "Laikotarpiai: PATCH įrašą → 200"
  type: http
  seq: 19

http:
  method: PATCH
  url: "{{baseUrl}}/api/landlord/apartments/{{apartmentId}}/leases/{{leaseId}}/pe\
    riods/{{periodId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "2027 sausis (pakeista)"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("PATCH /api/landlord/apartments/{{apartmentId}}/leases/{{leaseId}}/periods/{{periodId}} → 200", function () {
          expect(res.status).to.equal(200);
        });

        test("Grąžintas tinkamas įrašas", function () {
          expect(res.body.data.id).to.equal(bru.getVar("periodId"));
          expect(res.body.data.name).to.equal("2027 sausis (pakeista)");
        });

        test("Laikotarpis priklauso URL nurodytai sutarčiai", function () {
          expect(res.body.data.leaseId).to.equal(bru.getVar("leaseId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
