info:
  name: "Butai: PUT įrašą → 201"
  type: http
  seq: 7

http:
  method: PUT
  url: "{{baseUrl}}/api/landlord/apartments/{{apartmentId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Bruno atnaujintas butas",
        "address": "Testų g. 15A, Vilnius"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("PUT /api/landlord/apartments/{{apartmentId}} → 201", function () {
          expect(res.status).to.equal(201);
        });

        test("Grąžintas tinkamas įrašas", function () {
          expect(res.body.data.id).to.equal(bru.getVar("apartmentId"));
          expect(res.body.data.name).to.equal("Bruno atnaujintas butas");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
