info:
  name: "Laikotarpiai: GET įrašą → 200"
  type: http
  seq: 18

http:
  method: GET
  url: "{{baseUrl}}/api/landlord/apartments/{{apartmentId}}/leases/{{leaseId}}/pe\
    riods/{{periodId}}"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("GET /api/landlord/apartments/{{apartmentId}}/leases/{{leaseId}}/periods/{{periodId}} → 200", function () {
          expect(res.status).to.equal(200);
        });

        test("Grąžintas tinkamas įrašas", function () {
          expect(res.body.data.id).to.equal(bru.getVar("periodId"));
        });

        test("Laikotarpis priklauso URL nurodytai sutarčiai", function () {
          expect(res.body.data.leaseId).to.equal(bru.getVar("leaseId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
