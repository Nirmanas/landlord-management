opencollection: 1.0.0

info:
  name: Saitynai
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: "{{accessToken}}"
  variables:
    - name: baseUrl
      value: https://saitynai.nirmanas.dev
    - name: accessToken
      value: ""
    - name: apartmentId
      value: ""
    - name: tenantId
      value: "2"
    - name: tenantAccessToken
      value: ""
    - name: leaseId
      value: ""
    - name: periodId
      value: ""
    - name: reportedPaymentId
      value: ""
    - name: landlordEmail
      value: ""
    - name: landlordPassword
      value: ""
    - name: tenantEmail
      value: ""
    - name: tenantPassword
      value: ""
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
